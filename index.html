<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My GitHub Arcade</title>
    <style>
        body { background: #121212; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 40px; }
        h1 { text-align: center; color: #00ffcc; text-transform: uppercase; letter-spacing: 3px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; max-width: 1100px; margin: 50px auto; }
        .card { background: #1e1e1e; border-radius: 12px; overflow: hidden; text-decoration: none; color: white; border: 1px solid #333; transition: 0.3s; }
        .card:hover { transform: scale(1.05); border-color: #00ffcc; box-shadow: 0 0 15px rgba(0, 255, 204, 0.3); }
        .preview { width: 100%; height: 160px; background: #252525; display: flex; align-items: center; justify-content: center; font-size: 40px; }
        .info { padding: 15px; }
        .info h3 { margin: 0; font-size: 1.3rem; }
        .info p { color: #888; font-size: 0.9rem; margin-top: 5px; }
    </style>
</head>
<body>
    <h1>🕹️ GitHub Games Home</h1>
    <div class="grid">
        <!-- CHROME DINO (Local) -->
        <a href="dino/" class="card">
            <div class="preview">🦖</div>
            <div class="info"><h3>Dino Run</h3><p>Classic offline desert runner.</p></div>
        </a>
<div style="width: 800px; height: 600px; margin: auto; border: 5px solid #333;">
    <iframe 
        src="https://github.io" 
        style="width: 100%; height: 100%; border: none;"
        allow="autoplay; fullscreen; keyboard"
        sandbox="allow-forms allow-modals allow-popups allow-same-origin allow-scripts"
        allowfullscreen>
    </iframe>
</div>
