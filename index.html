<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Web Portal</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            min-height: 100vh;
        }

        header { margin-top: 50px; text-align: center; }
        h1 { font-size: 3rem; background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            width: 90%;
            max-width: 1000px;
            padding: 50px 0;
        }

        .tile {
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            text-decoration: none;
            color: white;
            transition: 0.3s;
        }

        .tile:hover {
            transform: translateY(-10px);
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.3);
        }

        .icon { font-size: 3rem; display: block; margin-bottom: 15px; }
        .name { font-weight: bold; font-size: 1.2rem; }
    </style>
</head>
<body>

    <header>
        <h1>My Game Web</h1>
        <p style="opacity:0.6">Select a game to play</p>
    </header>

    <div class="grid">
        <a href="CookieClicker/index.html" class="tile">
            <span class="icon">🍪</span>
            <span class="name">Cookie Clicker</span>
        </a>
        <a href="RagdollPhysics/index.html" class="tile">
            <span class="icon">🕺</span>
            <span class="name">Ragdoll PPG</span>
        </a>
        <a href="TowerBlocks/index.html" class="tile">
            <span class="icon">🏗️</span>
            <span class="name">Tower Blocks</span>
        </a>
        <a href="Web-Man/index.html" class="tile">
            <span class="icon">🕸️</span>
            <span class="name">Web-Man</span>
        </a>
    </div>

</body>
</html>
