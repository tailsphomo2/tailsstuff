<!DOCTYPE html>
<html>
<head>
    <title>Web-Man: Swing City</title>
    <style>
        body { margin: 0; overflow: hidden; background: #020617; font-family: sans-serif; }
        #stats { position: absolute; top: 20px; left: 20px; color: #38bdf8; pointer-events: none; }
    </style>
</head>
<body>
    <div id="stats">
        <h2>WEB-MAN</h2>
        [CLICK & HOLD] Shoot Web | [W/A/D] Move Air
    </div>
    <canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
let w, h, mouse = {x:0, y:0, down:false};

// Physics Constants
const gravity = 0.4, friction = 0.99, airResistance = 0.995;
let player = { x: 100, y: 100, vx: 0, vy: 0, r: 10 };
let web = { active: false, anchorX: 0, anchorY: 0, length: 0 };
let buildings = [];

function generateCity() {
    buildings = [];
    for(let i=0; i<20; i++) {
        buildings.push({
            x: i * 300 + Math.random() * 50,
            w: 150 + Math.random() * 100,
            h: 200 + Math.random() * 400
        });
    }
}

function update() {
    // Movement Logic
    if (web.active) {
        let dx = player.x - web.anchorX, dy = player.y - web.anchorY;
        let dist = Math.sqrt(dx*dx + dy*dy);
        
        if (dist > web.length) {
            let angle = Math.atan2(dy, dx);
            player.x = web.anchorX + Math.cos(angle) * web.length;
            player.y = web.anchorY + Math.sin(angle) * web.length;
            
            // Constrain velocity to the circle of the swing
            let v = Math.sqrt(player.vx*player.vx + player.vy*player.vy);
            let vAngle = Math.atan2(player.vy, player.vx);
            let tangentAngle = angle + Math.PI/2;
            
            player.vx = Math.cos(tangentAngle) * v * 0.99;
            player.vy = Math.sin(tangentAngle) * v * 0.99;
        }
    }

    player.vy += gravity;
    player.vx *= airResistance;
    player.vy *= airResistance;
    player.x += player.vx;
    player.y += player.vy;

    // Floor Collision
    if (player.y > h - player.r) {
        player.y = h - player.r;
        player.vy *= -0.2;
    }

    // Camera follow (Simple)
    ctx.setTransform(1, 0, 0, 1, -player.x + w/3, 0);
}

function draw() {
    ctx.clearRect(player.x - w, 0, w*3, h);
    
    // Draw Buildings
    ctx.fillStyle = '#1e293b';
    buildings.forEach(b => {
        ctx.fillRect(b.x, h - b.h, b.w, b.h);
        // Windows
        ctx.fillStyle = '#334155';
        for(let j=0; j<b.h/40; j++) {
            ctx.fillRect(b.x + 10, h - b.h + 10 + (j*40), b.w - 20, 20);
        }
        ctx.fillStyle = '#1e293b';
    });

    // Draw Web
    if (web.active) {
        ctx.beginPath();
        ctx.strokeStyle = '#f1f5f9';
        ctx.lineWidth = 2;
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(web.anchorX, web.anchorY);
        ctx.stroke();
    }

    // Draw Player
    ctx.fillStyle = '#ef4444'; // Red suit
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = 'white'; // Eyes
    ctx.fillRect(player.x - 5, player.y - 5, 4, 3);
    ctx.fillRect(player.x + 1, player.y - 5, 4, 3);

    requestAnimationFrame(() => {
        update();
        draw();
    });
}

window.onmousedown = (e) => {
    mouse.down = true;
    web.anchorX = e.clientX + (player.x - w/3);
    web.anchorY = e.clientY;
    let dx = player.x - web.anchorX, dy = player.y - web.anchorY;
    web.length = Math.sqrt(dx*dx + dy*dy);
    web.active = true;
};

window.onmouseup = () => {
    web.active = false;
    mouse.down = false;
};

window.onkeydown = (e) => {
    if(e.key === 'a') player.vx -= 0.5;
    if(e.key === 'd') player.vx += 0.5;
};

window.onresize = () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; };
window.onresize();
generateCity();
draw();
</script>
</body>
</html>
