<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Game Portal</title>
    <style>
        /* Modern CSS setup */
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --hover-shadow: rgba(56, 189, 248, 0.4);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            margin-top: 60px;
            text-align: center;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            letter-spacing: -1px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p { opacity: 0.7; font-size: 1.1rem; }

        /* Game Tile Grid */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 30px;
            width: 90%;
            max-width: 1100px;
            padding: 60px 0;
        }

        /* Tile Styling & Effects */
        .game-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px 20px;
            text-align: center;
            text-decoration: none;
            color: inherit;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .game-card:hover {
            transform: translateY(-12px);
            border-color: var(--accent-color);
            box-shadow: 0 20px 40px var(--hover-shadow);
        }

        /* Glossy Shine Effect on Hover */
        .game-card::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .game-card:hover::after { opacity: 1; }

        .icon {
            font-size: 4rem;
            display: block;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));
        }

        .title {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        footer {
            margin-top: auto;
            padding-bottom: 30px;
            opacity: 0.4;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Game Portal</h1>
        <p>Choose your experience</p>
    </header>

    <main class="game-grid">
        <!-- Tile 1: CookieClicker -->
        <a href="CookieClicker/index.html" class="game-card">
            <span class="icon">🍪</span>
            <span class="title">Cookie Clicker</span>
        </a>

        <!-- Tile 2: RagdollPhysics -->
        <a href="RagdollPhysics/index.html" class="game-card">
            <span class="icon">🕺</span>
            <span class="title">Ragdoll Physics</span>
        </a>

        <!-- Tile 3: TowerBlocks -->
        <a href="TowerBlocks/index.html" class="game-card">
            <span class="icon">🏗️</span>
            <span class="title">Tower Blocks</span>
        </a>

        <!-- Tile 4: Web-Man -->
        <a href="Web-Man/index.html" class="game-card">
            <span class="icon">🕸️</span>
            <span class="title">Web-Man</span>
        </a>
    </main>

    <footer>
        &copy; 2024 Gaming Hub • Built with Space & Speed
    </footer>

</body>
</html>
