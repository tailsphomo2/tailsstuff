# TailsPhomo's Edu Website

## index.html

```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TailsPhomo's Edu</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b1220;
      color: white;
      min-height: 100vh;
    }

    header {
      background: #111827;
      padding: 30px 20px;
      text-align: center;
      border-bottom: 3px solid #2563eb;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }

    header h1 {
      font-size: 2.2rem;
      color: #60a5fa;
      margin-bottom: 10px;
    }

    header p {
      color: #cbd5e1;
      font-size: 1rem;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 40px;
      max-width: 1200px;
      margin: auto;
    }

    .game-card {
      background: #1e293b;
      border-radius: 16px;
      padding: 25px;
      transition: 0.3s ease;
      border: 2px solid transparent;
      text-decoration: none;
      color: white;
      box-shadow: 0 6px 15px rgba(0,0,0,0.35);
    }

    .game-card:hover {
      transform: translateY(-6px);
      border-color: #60a5fa;
      background: #273549;
    }

    .game-card h2 {
      margin-bottom: 10px;
      color: #93c5fd;
    }

    .game-card p {
      color: #cbd5e1;
      font-size: 0.95rem;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #94a3b8;
      margin-top: 30px;
    }
  </style>
</head>
