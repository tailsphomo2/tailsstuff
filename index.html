<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tailsphomo's games</title>
    <style>
        :root {
            --bg: #0b0b0e;
            --accent: #00ffd2;
            --text-main: #ffffff;
            --text-dim: #a0a0a5;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        header { margin-bottom: 40px; }

        h1 {
            font-size: clamp(2.5rem, 8vw, 4rem);
            margin: 0;
            font-weight: 800;
            letter-spacing: -2px;
            background: linear-gradient(to bottom, #fff 40%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .discord {
            color: var(--text-dim);
            font-size: 1rem;
            margin-top: 10px;
            font-family: monospace;
            border: 1px solid #2d2d33;
            padding: 5px 15px;
            border-radius: 50px;
            display: inline-block;
        }

        /* The Game Links Section */
        .game-list {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .game-link {
            color: var(--text-main);
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 500;
            transition: 0.3s;
            opacity: 0.7;
        }

        .game-link:hover {
            opacity: 1;
            color: var(--accent);
            transform: scale(1.1);
        }

        .glow {
            position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 300px; height: 300px;
            background: var(--accent);
            filter: blur(150px);
            opacity: 0.1;
            z-index: -1;
        }
    </style>
</head>
<body>

    <div class="glow"></div>

    <header>
        <h1>tailsphomo's games</h1>
        <div class="discord">@tailsphomothesecond (discord)</div>
    </header>

    <nav class="game-list">
        <!-- These links point to your new folders -->
        <a href="./webman/" class="game-link">🕸️ Web-Man</a>
        <a href="./playground/" class="game-link">🚶 Ragdoll Sandbox</a>
        <a href="./tower/" class="game-link">🏗️ Tower Blocks</a>
        <a href="./cookie/" class="game-link">🍪 Cookie Clicker</a>
    </nav>

</body>
</html>
