<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tailsphomo's edu (NoahH)</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --neon: #00f2ff;
            --neon-dim: rgba(0, 242, 255, 0.2);
            --bg: #020205;
            --panel: rgba(10, 15, 25, 0.9);
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            margin: 0;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Moving Grid Background */
        .grid-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            perspective: 600px;
            z-index: -1;
        }

        .grid-floor {
            position: absolute;
            width: 200%; height: 100%;
            top: 20%; left: -50%;
            background-image: 
                linear-gradient(var(--neon-dim) 1px, transparent 1px),
                linear-gradient(90deg, var(--neon-dim) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: rotateX(60deg);
            animation: moveGrid 4s linear infinite;
        }

        @keyframes moveGrid {
            from { transform: rotateX(60deg) translateY(0); }
            to { transform: rotateX(60deg) translateY(50px); }
        }

        header { margin: 80px 0; text-align: center; }

        /* Glitch Title */
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            letter-spacing: 5px;
            color: var(--neon);
            position: relative;
            animation: glitch 3s infinite;
        }

        @keyframes glitch {
            0% { text-shadow: 2px 0 red, -2px 0 blue; }
            1% { text-shadow: -2px 0 red, 2px 0 blue; }
            2% { text-shadow: 0 0 white; }
            100% { text-shadow: 0 0 white; }
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            width: 90%;
            max-width: 1200px;
            padding-bottom: 100px;
        }

        .tile {
            position: relative;
            background: var(--panel);
            border: 1px solid var(--neon-dim);
            padding: 50px 20px;
            text-align: center;
            text-decoration: none;
            color: white;
            transition: 0.3s cubic-bezier(0.19, 1, 0.22, 1);
            clip-path: polygon(0 10%, 10% 0, 100% 0, 100% 90%, 90% 100%, 0 100%);
        }

        .tile:hover {
            transform: scale(1.05);
            border-color: var(--neon);
            box-shadow: 0 0 20px var(--neon-dim);
            background: rgba(0, 242, 255, 0.05);
        }

        /* Scanline Effect */
        .tile::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: var(--neon);
            opacity: 0;
            transition: 0s;
        }

        .tile:hover::after {
            opacity: 0.5;
            animation: scan 1.5s linear infinite;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .icon { font-size: 3rem; display: block; margin-bottom: 15px; filter: drop-shadow(0 0 5px var(--neon)); }
        .name { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; color: var(--neon); }
        .tag { font-size: 0.7rem; color: #555; margin-top: 10px; display: block; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="grid-bg"><div class="grid-floor"></div></div>

    <header>
        <p style="letter-spacing: 10px; color: #444; font-size: 10px;">SYSTEM OVERRIDE: NOAH-H</p>
        <h1>tailsphomo's edu</h1>
    </header>

    <main class="container">
        <!-- LINKED TO YOUR PPG FOLDER -->
        <a href="RagdollPhysics/index.html" class="tile">
            <span class="icon">🕺</span>
            <span class="name">RAGDOLL PPG</span>
            <span class="tag">PHYSICS_ENGINE_ACTIVE</span>
        </a>

        <a href="Web-Man/index.html" class="tile">
            <span class="icon">🕸️</span>
            <span class="name">WEB-MAN</span>
            <span class="tag">MOMENTUM_LINK_V4</span>
        </a>

        <a href="CookieClicker/index.html" class="tile">
            <span class="icon">🍪</span>
            <span class="name">COOKIE CLICKER</span>
            <span class="tag">DATA_MINE_COLLECTOR</span>
        </a>

        <a href="TowerBlocks/index.html" class="tile">
            <span class="icon">🏗️</span>
            <span class="name">TOWER BLOCKS</span>
            <span class="tag">INTEGRITY_TEST_STMT</span>

        <a href="https://youtube.com" target="_blank" class="tile">
            <span class="icon">📺</span>
            <span class="name">YOUTUBE</span>
            <span class="tag">EXT_SIGNAL_RECEIVE</span>
        </a>
    </main>

</body>
</html>

</html>
