<!DOCTYPE html>
<html>
<body style="margin:0; background:#333; display:flex; justify-content:center; align-items:center; height:100vh;">
<canvas id="game" width="400" height="600" style="background:#000;"></canvas>
<script>
const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
let blocks = [{x: 100, w: 200}], speed = 2, currentX = 0, direction = 1, gameOver = false;

function loop() {
    if(gameOver) return;
    ctx.clearRect(0,0,400,600);
    blocks.forEach((b, i) => {
        ctx.fillStyle = `hsl(${i * 40}, 70%, 50%)`;
        ctx.fillRect(b.x, 600 - (i+1)*40, b.w, 38);
    });
    currentX += speed * direction;
    if(currentX < 0 || currentX + blocks[blocks.length-1].w > 400) direction *= -1;
    ctx.fillStyle = '#fff';
    ctx.fillRect(currentX, 600 - (blocks.length+1)*40, blocks[blocks.length-1].w, 38);
    requestAnimationFrame(loop);
}

window.onclick = () => {
    let last = blocks[blocks.length-1];
    let newW = last.w - Math.abs(currentX - last.x);
    if(newW <= 0) { alert("Game Over! Score: " + (blocks.length-1)); location.reload(); }
    blocks.push({x: Math.max(currentX, last.x), w: newW});
    speed += 0.2;
};
loop();
</script>
</body>
</html>
