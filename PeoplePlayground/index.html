<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>People Playground Web - tailsphomo's edu</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Space Grotesk', sans-serif;
        }

        /* The window that holds the game */
        iframe {
            width: 100%;
            height: calc(100% - 50px); /* Leaves room for the top bar */
            border: none;
        }

        /* Top Bar with Home Button */
        .top-bar {
            height: 50px;
            background: #111;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid #333;
        }

        .home-btn {
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            padding: 8px 16px;
            border: 1px solid #38bdf8;
            border-radius: 5px;
            transition: 0.3s;
        }

        .home-btn:hover {
            background: #38bdf8;
            color: white;
        }

        .title {
            margin-left: 20px;
            color: #555;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="../index.html" class="home-btn">← BACK TO HOME</a>
        <div class="title">tailsphomo's edu - PPG Web Edition</div>
    </div>

    <!-- This loads the itch.io game directly inside your site -->
    <iframe 
        src="https://itch.io" 
        allow="autoplay; gamepad; fullscreen; keyboard" 
        scrolling="no">
    </iframe>

</body>
