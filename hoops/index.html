<!DOCTYPE html>
<html>
<head>
    <title>Hoops Game</title>
    <style>
        body { background: #222; color: #fff; text-align: center; font-family: sans-serif; overflow: hidden; margin: 0; }
        canvas { background: #333; display: block; margin: 20px auto; border: 5px solid #444; border-radius: 10px; cursor: crosshair; }
        #ui { position: absolute; top: 30px; width: 100%; font-size: 24px; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui">Score: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    <p>Click and Drag to Aim & Shoot!</p>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');

        let score = 0;
        let ball = { x: 100, y: 300, radius: 15, vx: 0, vy: 0, shooting: false };
        let hoop = { x: 500, y: 150, width: 60, height: 10 };
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Hoop
            ctx.fillStyle = "orange";
            ctx.fillRect(hoop.x, hoop.y, hoop.width, hoop.height);
            ctx.fillStyle = "white";
            ctx.fillRect(hoop.x + hoop.width, hoop.y - 40, 5, 50); // Backboard

            // Draw Ball
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = "#ff6600";
            ctx.fill();
            ctx.closePath();

            if (ball.shooting) {
                ball.x += ball.vx;
                ball.y += ball.vy;
                ball.vy += 0.2; // Gravity

                // Score Check
                if (ball.x > hoop.x && ball.x < hoop.x + hoop.width && ball.y > hoop.y && ball.y < hoop.y + hoop.height + 10) {
                    score++;
                    scoreEl.innerText = score;
                    resetBall();
                }

                // Reset if off screen
                if (ball.y > canvas.height || ball.x > canvas.width) resetBall();
            }
            requestAnimationFrame(draw);
        }

        function resetBall() {
            ball.x = 100; ball.y = 300; ball.vx = 0; ball.vy = 0; ball.shooting = false;
        }

        canvas.onmousedown = (e) => {
            if (ball.shooting) return;
            isDragging = true;
            dragStart = { x: e.clientX, y: e.clientY };
        };

        canvas.onmouseup = (e) => {
            if (!isDragging) return;
            isDragging = false;
            ball.vx = (dragStart.x - e.clientX) / 10;
            ball.vy = (dragStart.y - e.clientY) / 10;
            ball.shooting = true;
        };

        draw();
    </script>
</body>
</html>
