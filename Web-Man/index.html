<!DOCTYPE html>
<html>
<head>
    <title>Web-Man</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <script>
        const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let p = {x: 100, y: 100, vx: 0, vy: 0}, hook = null, gravity = 0.5;
        window.onmousedown = (e) => { hook = {x: e.clientX, y: e.clientY, len: Math.hypot(e.clientX-p.x, e.clientY-p.y)}; };
        window.onmouseup = () => { hook = null; };
        function update() {
            ctx.fillStyle = "rgba(0,0,0,0.2)"; ctx.fillRect(0,0,canvas.width, canvas.height);
            if (hook) {
                let dx = p.x - hook.x, dy = p.y - hook.y, d = Math.hypot(dx, dy);
                if (d > hook.len) {
                    p.vx -= dx * 0.01; p.vy -= dy * 0.01;
                }
                ctx.strokeStyle = "white"; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(hook.x, hook.y); ctx.stroke();
            }
            p.vy += gravity; p.x += p.vx; p.y += p.vy;
            p.vx *= 0.99; p.vy *= 0.99;
            if (p.y > canvas.height) { p.y = canvas.height; p.vy *= -0.5; }
            ctx.fillStyle = "cyan"; ctx.fillRect(p.x-10, p.y-10, 20, 20);
            requestAnimationFrame(update);
        }
        update();
    </script>
</body>
</html>
