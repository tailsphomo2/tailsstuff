<!DOCTYPE html>
<html>
<head>
    <title>Cookie Clicker</title>
    <style>
        body { background: #222; color: #fff; text-align: center; font-family: sans-serif; padding-top: 50px; }
        #cookie { font-size: 100px; cursor: pointer; user-select: none; transition: transform 0.1s; display: inline-block; }
        #cookie:active { transform: scale(0.9); }
        .stats { font-size: 24px; margin: 20px; }
        button { padding: 10px 20px; background: #00ffd2; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #555; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="stats">Cookies: <span id="count">0</span></div>
    <div id="cookie">🍪</div>
    <div class="stats"><button id="upgrade" onclick="buyUpgrade()">Buy Auto-Clicker (Cost: 50)</button></div>
    <script>
        let count = 0, auto = 0, cost = 50;
        const countEl = document.getElementById('count'), upEl = document.getElementById('upgrade');
        document.getElementById('cookie').onclick = () => { count++; update(); };
        function buyUpgrade() { if(count >= cost) { count -= cost; auto++; cost = Math.floor(cost * 1.5); update(); } }
        function update() { countEl.innerText = Math.floor(count); upEl.innerText = `Buy Auto-Clicker (Cost: ${cost})`; upEl.disabled = count < cost; }
        setInterval(() => { count += auto; update(); }, 1000);
    </script>
</body>
</html>
