<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #222; color: #fff; text-align: center; font-family: sans-serif; }
        #cookie { font-size: 100px; cursor: pointer; transition: transform 0.1s; display: inline-block; }
        #cookie:active { transform: scale(0.9); }
        .stat { font-size: 24px; margin: 20px; }
        button { padding: 10px 20px; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="stat">Cookies: <span id="count">0</span></div>
    <div id="cookie">🍪</div>
    <p>Autoclickers: <span id="auto">0</span></p>
    <button onclick="buy()">Buy Auto (Cost: <span id="cost">10</span>)</button>

    <script>
        let cookies = 0, autos = 0, cost = 10;
        const countEl = document.getElementById('count'), autoEl = document.getElementById('auto'), costEl = document.getElementById('cost');

        document.getElementById('cookie').onclick = () => { cookies++; update(); };
        function buy() {
            if(cookies >= cost) { cookies -= cost; autos++; cost = Math.floor(cost * 1.5); update(); }
        }
        function update() { countEl.innerText = cookies; autoEl.innerText = autos; costEl.innerText = cost; }
        setInterval(() => { if(autos > 0) { cookies += autos; update(); } }, 1000);
    </script>
</body>
</html>
