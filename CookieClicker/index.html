<!DOCTYPE html>
<html>
<head>
<title>Cookie Clicker</title>
<style>
body {
  background: #1e1b16;
  color: white;
  text-align: center;
  font-family: Arial;
}

button {
  width: 200px;
  height: 200px;
  border-radius: 50%;
  font-size: 24px;
  border: none;
  background: orange;
  cursor: pointer;
}
</style>
</head>
<body>

<h1>Cookie Clicker</h1>
<h2 id="count">Cookies: 0</h2>
<button onclick="clickCookie()">🍪</button>

<script>
let cookies = 0;

function clickCookie() {
  cookies++;
  document.getElementById('count').innerText = 'Cookies: ' + cookies;
}
</script>

</body>
</html>
