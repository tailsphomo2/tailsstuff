<!DOCTYPE html>
<html>
<body style="margin:0; overflow:hidden; background:#111;">
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
let width, height, mouse = {x:0, y:0, down:false, target:null};
const gravity = 0.5, friction = 0.98;

class Point {
    constructor(x, y) { this.x = this.oldX = x; this.y = this.oldY = y; }
    update() {
        let vx = (this.x - this.oldX) * friction, vy = (this.y - this.oldY) * friction;
        this.oldX = this.x; this.oldY = this.y;
        this.x += vx; this.y += vy + gravity;
        if(this.y > height) this.y = height;
    }
}

class Stick {
    constructor(p1, p2, len) { this.p1 = p1; this.p2 = p2; this.len = len; }
    update() {
        let dx = this.p2.x - this.p1.x, dy = this.p2.y - this.p1.y;
        let dist = Math.sqrt(dx*dx + dy*dy), diff = (this.len - dist) / dist * 0.5;
        this.p1.x -= dx * diff; this.p1.y -= dy * diff;
        this.p2.x += dx * diff; this.p2.y += dy * diff;
    }
}

let pts = [new Point(200,100), new Point(200,150), new Point(170,180), new Point(230,180), new Point(180,250), new Point(220,250)];
let sticks = [new Stick(pts[0],pts[1],50), new Stick(pts[1],pts[2],40), new Stick(pts[1],pts[3],40), new Stick(pts[1],pts[4],80), new Stick(pts[1],pts[5],80)];

function loop() {
    ctx.clearRect(0,0,width,height);
    if(mouse.down && mouse.target) { mouse.target.x = mouse.x; mouse.target.y = mouse.y; }
    pts.forEach(p => p.update());
    for(let i=0; i<5; i++) sticks.forEach(s => s.update());
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
    sticks.forEach(s => { ctx.beginPath(); ctx.moveTo(s.p1.x, s.p1.y); ctx.lineTo(s.p2.x, s.p2.y); ctx.stroke(); });
    requestAnimationFrame(loop);
}

window.onresize = () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; };
window.onmousedown = (e) => { 
    mouse.down = true; 
    pts.forEach(p => { if(Math.hypot(p.x-e.clientX, p.y-e.clientY) < 30) mouse.target = p; });
};
window.onmouseup = () => { mouse.down = false; mouse.target = null; };
window.onmousemove = (e) => { mouse.x = e.clientX; mouse.y = e.clientY; };
window.onresize(); loop();
</script>
</body>
</html>
