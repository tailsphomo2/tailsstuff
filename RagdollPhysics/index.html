<!DOCTYPE html>
<html>
<head>
    <title>Advanced Web Playground</title>
    <style>
        body { margin: 0; overflow: hidden; background: #080808; color: #666; font-family: sans-serif; user-select: none; }
        #ui { position: absolute; top: 15px; left: 15px; pointer-events: none; }
        .key { color: #0cf; font-weight: bold; }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="ui">
        <h2 style="color: #eee; margin:0;">PHYSICS LAB</h2>
        [DRAG] Interaction | <span class="key">1</span> SPAWN GUN | <span class="key">2</span> SPAWN KNIFE<br>
        <span class="key">F</span> USE HELD ITEM | <span class="key">P</span> SPAWN PERSON | <span class="key">R</span> RESET
    </div>
    <canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
let w, h, mouse = {x:0, y:0, down:false, target:null, heldItem:null};
const gravity = 0.5, friction = 0.98, standStrength = 0.15;
let people = [], items = [], blood = [];

class Point {
    constructor(x, y, radius=5) { this.x=this.oldX=x; this.y=this.oldY=y; this.radius=radius; this.active=true; }
    update() {
        let vx = (this.x - this.oldX) * friction, vy = (this.y - this.oldY) * friction;
        this.oldX = this.x; this.oldY = this.y;
        this.x += vx; this.y += vy + gravity;
        if(this.y > h-25) { this.y = h-25; this.oldY = this.y + vy * 0.3; }
        if(this.x < 25 || this.x > w-25) { this.x = Math.max(25, Math.min(w-25, this.x)); this.oldX = this.x + vx * 0.3; }
    }
}

class Stick {
    constructor(p1, p2, len, thick=10) { this.p1=p1; this.p2=p2; this.len=len; this.thick=thick; this.active=true; }
    update() {
        let dx = this.p2.x - this.p1.x, dy = this.p2.y - this.p1.y;
        let dist = Math.sqrt(dx*dx + dy*dy), diff = (this.len - dist) / dist * 0.5;
        this.p1.x -= dx * diff; this.p1.y -= dy * diff;
        this.p2.x += dx * diff; this.p2.y += dy * diff;
    }
    draw() {
        if(!this.active) return;
        ctx.strokeStyle = '#fff'; ctx.lineWidth = this.thick; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(this.p1.x, this.p1.y); ctx.lineTo(this.p2.x, this.p2.y); ctx.stroke();
    }
}

function spawnPerson(x, y) {
    let p = [
        new Point(x, y-110, 15), // 0: Head
        new Point(x, y-80),      // 1: Neck
        new Point(x, y-40),      // 2: Hips
        new Point(x-20, y-75),   // 3: L-Shoulder
        new Point(x+20, y-75),   // 4: R-Shoulder
        new Point(x-25, y-40),   // 5: L-Hand
        new Point(x+25, y-40),   // 6: R-Hand
        new Point(x-15, y),      // 7: L-Foot
        new Point(x+15, y)       // 8: R-Foot
    ];
    let s = [
        new Stick(p,p,30, 20), new Stick(p,p,45, 25), // Body
        new Stick(p,p,40, 12), new Stick(p,p,40, 12), // Arms
        new Stick(p,p,45, 15), new Stick(p,p,45, 15), // Legs
        new Stick(p,p,15, 10), new Stick(p,p,15, 10)  // Shoulders
    ];
    people.push({p, s, standing: true});
}

function spawnWeapon(type, x, y) {
    let p1 = new Point(x, y), p2 = new Point(x+30, y);
    items.push({p1, p2, type, active: true});
}

function spawnBlood(x, y) {
    for(let i=0; i<10; i++) blood.push({x, y, vx:(Math.random()-0.5)*10, vy:(Math.random()-0.5)*10, life:60});
}

function loop() {
    ctx.fillStyle = '#080808'; ctx.fillRect(0,0,w,h);
    ctx.fillStyle = '#111'; ctx.fillRect(0, h-25, w, 25); // Floor

    people.forEach(person => {
        // Active Standing Logic
        if(person.standing) {
            person.p[0].vy -= standStrength; // Pull head up
            let dx = person.p[0].x - person.p[2].x;
            person.p[2].vx += dx * 0.01; // Balance hips
        }
        person.p.forEach(pt => pt.update());
        for(let i=0; i<10; i++) person.s.forEach(st => st.update());
        person.s.forEach(st => st.draw());
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(person.p.x, person.p.y, 15, 0, 7); ctx.fill();
    });

    items.forEach(item => {
        item.p1.update(); item.p2.update();
        let dx = item.p2.x - item.p1.x, dy = item.p2.y - item.p1.y;
        let dist = Math.sqrt(dx*dx + dy*dy), diff = (30 - dist) / dist * 0.5;
        item.p1.x -= dx * diff; item.p1.y -= dy * diff;
        item.p2.x += dx * diff; item.p2.y += dy * diff;

        ctx.strokeStyle = item.type === 'gun' ? '#444' : '#888';
        ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(item.p1.x, item.p1.y); ctx.lineTo(item.p2.x, item.p2.y); ctx.stroke();
    });

    blood.forEach((b, i) => {
        b.x += b.vx; b.y += b.vy; b.vy += 0.3; b.life--;
        ctx.fillStyle = `rgba(200,0,0,${b.life/60})`; ctx.fillRect(b.x, b.y, 3, 3);
        if(b.life <= 0) blood.splice(i, 1);
    });

    if(mouse.down && mouse.target) { mouse.target.x = mouse.x; mouse.target.y = mouse.y; }
    requestAnimationFrame(loop);
}

window.onkeydown = (e) => {
    if(e.key === '1') spawnWeapon('gun', mouse.x, mouse.y);
    if(e.key === '2') spawnWeapon('knife', mouse.x, mouse.y);
    if(e.key === 'p') spawnPerson(mouse.x, mouse.y);
    if(e.key === 'r') { people=[]; items=[]; blood=[]; }
    if(e.key === 'f' && mouse.heldItem) {
        if(mouse.heldItem.type === 'gun') {
            spawnBlood(mouse.heldItem.p2.x + 100, mouse.heldItem.p2.y); // Fake projectile
            mouse.heldItem.p1.x -= 20; // Recoil
        } else {
            mouse.heldItem.p2.x += 40; // Knife thrust
        }
    }
};

window.onmousedown = (e) => {
    mouse.down = true;
    [...people.flatMap(p => p.p), ...items.flatMap(i => [i.p1, i.p2])].forEach(p => {
        if(Math.hypot(p.x-e.clientX, p.y-e.clientY) < 30) {
            mouse.target = p;
            items.forEach(it => { if(it.p1 === p || it.p2 === p) mouse.heldItem = it; });
        }
    });
};
window.onmouseup = () => { mouse.down = false; mouse.target = null; };
window.onmousemove = (e) => { mouse.x = e.clientX; mouse.y = e.clientY; };
window.onresize = () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; };
window.onresize(); spawnPerson(w/2, h/2); loop();
</script>
</body>
</html>
