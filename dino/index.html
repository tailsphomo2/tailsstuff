<!DOCTYPE html>
<html>
<head>
    <title>Chrome Dino Pro</title>
    <style>
        body { text-align: center; background: #fff; font-family: 'Courier New', Courier, monospace; margin: 0; }
        canvas { background: #fff; border-bottom: 2px solid #535353; margin-top: 50px; cursor: pointer; }
        .score { font-size: 20px; color: #535353; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="score">Score: <span id="scoreVal">0</span></div>
    <canvas id="game" width="800" height="200"></canvas>
    <p>Press <b>SPACE</b> or <b>TAP</b> to Jump</p>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        // --- IMAGES ---
        const dinoImg = new Image();
        dinoImg.src = 'https://githubusercontent.com'; 
        // Note: This is a sprite sheet containing all game graphics

        let score = 0;
        let gameSpeed = 6;
        let dino = { x: 50, y: 150, w: 44, h: 47, dy: 0, jump: -12, grounded: true, frame: 0 };
        let obstacles = [];

        function draw() {
            ctx.clearRect(0, 0, 800, 200);
            
            // 1. Dino Gravity
            if (!dino.grounded) { 
                dino.dy += 0.8; 
                dino.y += dino.dy; 
            }
            if (dino.y >= 150) { 
                dino.y = 150; 
                dino.grounded = true; 
            }

            // 2. Draw Dino (Using sprite coordinates)
            // ctx.drawImage(image, sx, sy, sWidth, sHeight, dx, dy, dWidth, dHeight)
            let spriteX = 848; // Dino stationary sprite position
            if (!dino.grounded) spriteX = 848; // Jump sprite
            else {
                // Animation loop
                dino.frame++;
                spriteX = dino.frame % 20 < 10 ? 936 : 980; 
            }
            ctx.drawImage(dinoImg, spriteX, 2, 44, 47, dino.x, dino.y, dino.w, dino.h);

            // 3. Obstacles (Cacti)
            if (Math.random() < 0.015) {
                obstacles.push({ x: 850, y: 155, w: 25, h: 50 });
            }
            
            for(let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= gameSpeed;
                
                // Draw Cactus (Using sprite coordinates)
                ctx.drawImage(dinoImg, 446, 2, 34, 70, obstacles[i].x, obstacles[i].y, obstacles[i].w, obstacles[i].h);

                // Collision Detection
                if (dino.x < obstacles[i].x + obstacles[i].w && 
                    dino.x + dino.w > obstacles[i].x && 
                    dino.y < obstacles[i].y + obstacles[i].h && 
                    dino.y + dino.h > obstacles[i].y) {
                    alert("GAME OVER! Score: " + Math.floor(score));
                    location.reload();
                }

                if (obstacles[i].x < -50) {
                    obstacles.splice(i, 1);
                    score += 1;
                    document.getElementById('scoreVal').innerText = Math.floor(score);
                }
            }

            gameSpeed += 0.001; // Make game faster over time
            requestAnimationFrame(draw);
        }

        window.addEventListener('keydown', e => { 
            if (e.code === 'Space' && dino.grounded) { 
                dino.dy = dino.jump; 
                dino.grounded = false; 
            } 
        });

        dinoImg.onload = () => { draw(); };
    </script>
</body>
</html>
