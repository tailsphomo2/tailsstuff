<!DOCTYPE html>
<html>
<head>
    <title>Dino Run</title>
    <style>
        body { text-align: center; background: #f7f7f7; font-family: monospace; overflow: hidden; }
        canvas { border-bottom: 2px solid #535353; background: white; margin-top: 50px; }
    </style>
</head>
<body>
    <h2>Press SPACE to Jump</h2>
    <canvas id="game" width="600" height="150"></canvas>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        let dino = { x: 50, y: 100, w: 20, h: 20, dy: 0, jump: -10, grounded: true };
        let obstacles = [];
        let score = 0;

        function update() {
            ctx.clearRect(0, 0, 600, 150);
            // Dino Physics
            if (!dino.grounded) { dino.dy += 0.5; dino.y += dino.dy; }
            if (dino.y >= 100) { dino.y = 100; dino.grounded = true; }
            ctx.fillStyle = "#535353";
            ctx.fillRect(dino.x, dino.y, dino.w, dino.h);

            // Obstacles
            if (Math.random() < 0.02) obstacles.push({ x: 600, y: 100, w: 15, h: 20 });
            obstacles.forEach((o, i) => {
                o.x -= 5;
                ctx.fillRect(o.x, o.y, o.w, o.h);
                if (o.x < -20) { obstacles.splice(i, 1); score++; }
                if (dino.x < o.x + o.w && dino.x + dino.w > o.x && dino.y < o.y + o.h && dino.y + dino.h > o.y) {
                    alert("Game Over! Score: " + score);
                    location.reload();
                }
            });
            requestAnimationFrame(update);
        }
        window.addEventListener('keydown', e => { if (e.code === 'Space' && dino.grounded) { dino.dy = dino.jump; dino.grounded = false; } });
        update();
    </script>
</body>
</html>
