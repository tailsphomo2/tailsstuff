<!DOCTYPE html>
<html>
<head>
    <title>Dino Run</title>
    <style>
        body { text-align: center; background: #f0f0f0; font-family: monospace; overflow: hidden; }
        canvas { border-bottom: 2px solid #535353; background: white; margin-top: 50px; }
    </style>
</head>
<body>
    <h1>DINO RUN</h1>
    <p>Press <b>SPACE</b> to Jump</p>
    <canvas id="game" width="600" height="150"></canvas>
    
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        let score = 0;
        let dino = { x: 50, y: 100, w: 20, h: 20, dy: 0, jump: -10, grounded: true };
        let obstacles = [];

        function draw() {
            ctx.clearRect(0, 0, 600, 150);
            
            // Dino Physics
            if (!dino.grounded) { 
                dino.dy += 0.6; 
                dino.y += dino.dy; 
            }
            if (dino.y >= 100) { 
                dino.y = 100; 
                dino.grounded = true; 
            }

            // Draw Dino
            ctx.fillStyle = "#535353";
            ctx.fillRect(dino.x, dino.y, dino.w, dino.h);

            // Obstacles logic
            if (Math.random() < 0.015) obstacles.push({ x: 600, y: 105, w: 15, h: 15 });
            
            for(let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= 6;
                ctx.fillStyle = "red";
                ctx.fillRect(obstacles[i].x, obstacles[i].y, obstacles[i].w, obstacles[i].h);

                // Collision Detection
                if (dino.x < obstacles[i].x + obstacles[i].w && 
                    dino.x + dino.w > obstacles[i].x && 
                    dino.y < obstacles[i].y + obstacles[i].h && 
                    dino.y + dino.h > obstacles[i].y) {
                    alert("Game Over! Score: " + Math.floor(score));
                    location.reload();
                }

                if (obstacles[i].x < -20) obstacles.splice(i, 1);
            }
            score += 0.1;
            requestAnimationFrame(draw);
        }

        window.addEventListener('keydown', e => { 
            if (e.code === 'Space' && dino.grounded) { 
                dino.dy = dino.jump; 
                dino.grounded = false; 
            } 
        });

        draw();
    </script>
</body>
</html>
