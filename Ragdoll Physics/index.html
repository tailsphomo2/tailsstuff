<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ragdoll Physics Sandbox</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background: #1a1a1d; 
            color: #00ffd2; 
            font-family: 'Segoe UI', sans-serif; 
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas { 
            background: #25252b; 
            display: block; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            cursor: crosshair;
        }
        .controls {
            position: absolute;
            bottom: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid #333;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>
    <div class="controls">Click and Drag the limbs to toss the ragdoll!</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let gravity = 0.5;
let friction = 0.98;
let bounce = 0.7;
let points = [];
let sticks = [];
let mouse = { x: 0, y: 0, down: false, target: null };

function addPoint(x, y, vx, vy) {
    points.push({ x, y, oldX: x - vx, oldY: y - vy });
}

function addStick(p1, p2, dist) {
    sticks.push({ p1: points[p1], p2: points[p2], dist: dist || Math.hypot(points[p1].x - points[p2].x, points[p1].y - points[p2].y) });
}

// Build the Ragdoll
function initRagdoll() {
    const startX = canvas.width / 2;
    const startY = 150;

    // Points [index]
    addPoint(startX, startY, 0, 0);       // 0: Head
    addPoint(startX, startY + 40, 0, 0);  // 1: Neck/Shoulders
    addPoint(startX, startY + 90, 0, 0);  // 2: Hips
    addPoint(startX - 30, startY + 40, 0, 0); // 3: L-Shoulder
    addPoint(startX + 30, startY + 40, 0, 0); // 4: R-Shoulder
    addPoint(startX - 40, startY + 90, 0, 0); // 5: L-Elbow
    addPoint(startX + 40, startY + 90, 0, 0); // 6: R-Elbow
    addPoint(startX - 20, startY + 140, 0, 0); // 7: L-Knee
    addPoint(startX + 20, startY + 140, 0, 0); // 8: R-Knee
    addPoint(startX - 20, startY + 190, 0, 0); // 9: L-Foot
    addPoint(startX + 20, startY + 190, 0, 0); // 10: R-Foot

    // Connections (Sticks)
    addStick(0, 1, 40); // Head to Neck
    addStick(1, 2, 50); // Neck to Hips
    addStick(1, 3); addStick(1, 4); // Shoulders
    addStick(3, 5, 45); addStick(4, 6, 45); // Arms
    addStick(2, 7, 50); addStick(2, 8, 50); // Thighs
    addStick(7, 9, 50); addStick(8, 10, 50); // Shins
}

function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Physics Update
    points.forEach(p => {
        if (mouse.down && mouse.target === p) {
            p.x = mouse.x;
            p.y = mouse.y;
        }

        let vx = (p.x - p.oldX) * friction;
        let vy = (p.y - p.oldY) * friction;

        p.oldX = p.x;
        p.oldY = p.y;
        p.x += vx;
        p.y += vy + gravity;

        // Ground Collision
        if (p.y > canvas.height) {
            p.y = canvas.height;
            p.oldY = p.y + vy * bounce;
        }
        // Wall Collision
        if (p.x > canvas.width) { p.x = canvas.width; p.oldX = p.x + vx * bounce; }
        if (p.x < 0) { p.x = 0; p.oldX = p.x + vx * bounce; }
    });

    // Constraints (Stick stiffness)
    for (let i = 0; i < 5; i++) {
        sticks.forEach(s => {
            let dx = s.p2.x - s.p1.x;
            let dy = s.p2.y - s.p1.y;
            let distance = Math.sqrt(dx * dx + dy * dy);
            let difference = (s.dist - distance) / distance * 0.5;
            let offsetX = dx * difference;
            let offsetY = dy * difference;

            s.p1.x -= offsetX;
            s.p1.y -= offsetY;
            s.p2.x += offsetX;
            s.p2.y += offsetY;
        });
    }

    // Render Sticks
    ctx.beginPath();
    ctx.strokeStyle = '#00ffd2';
    ctx.lineWidth = 4;
    sticks.forEach(s => {
        ctx.moveTo(s.p1.x, s.p1.y);
        ctx.lineTo(s.p2.x, s.p2.y);
    });
    ctx.stroke();

    // Render Points (optional, shows joints)
    ctx.fillStyle = '#fff';
    points.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fill();
    });

    requestAnimationFrame(update);
}

// Mouse Controls
window.addEventListener('mousedown', (e) => {
    mouse.down = true;
    points.forEach(p => {
        if (Math.hypot(p.x - e.clientX, p.y - e.clientY) < 25) {
            mouse.target = p;
        }
    });
});

window.addEventListener('mouseup', () => {
    mouse.down = false;
    mouse.target = null;
});

window.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

initRagdoll();
update();
</script>
</body>
</html>
